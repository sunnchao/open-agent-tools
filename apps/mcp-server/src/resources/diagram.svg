<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">open-agent-tools MCP Server — Architecture</text>

  <!-- MCP Client -->
  <rect x="24" y="110" width="150" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="99" y="142" text-anchor="middle" font-size="15" font-weight="600" fill="#0c4a6e">MCP Client</text>
  <text x="99" y="164" text-anchor="middle" font-size="12" fill="#075985">Claude / IDE</text>

  <!-- Transport -->
  <line x1="174" y1="150" x2="250" y2="150" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="212" y="140" text-anchor="middle" font-size="11" fill="#475569">stdio /</text>
  <text x="212" y="153" text-anchor="middle" font-size="11" fill="#475569">HTTP</text>

  <!-- MCP Server -->
  <rect x="250" y="100" width="180" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">MCP Server</text>
  <text x="340" y="160" text-anchor="middle" font-size="12" fill="#166534">open-agent-tools-mcp</text>

  <!-- Tools -->
  <rect x="470" y="70" width="170" height="62" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="555" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#713f12">Tools</text>
  <text x="555" y="118" text-anchor="middle" font-size="11" fill="#854d0e">get_financial_reports</text>

  <!-- Resources -->
  <rect x="470" y="160" width="170" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="555" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Resources</text>
  <text x="555" y="208" text-anchor="middle" font-size="11" fill="#5b21b6">welcome / logo / reports</text>

  <line x1="430" y1="140" x2="470" y2="101" stroke="#475569" stroke-width="2"/>
  <line x1="430" y1="160" x2="470" y2="191" stroke="#475569" stroke-width="2"/>
