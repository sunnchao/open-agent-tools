<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑行记 · Pelican Ride</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Outfit:wght@400;600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0e1626; --card:#131e33; --accent:#ffb02e; --accent2:#ff5d5d; --teal:#37e0c8;
  }
  body{
    min-height:100vh; background: radial-gradient(1200px 600px at 50% -10%, #24406e 0%, var(--bg) 60%) , var(--bg);
    color:#eef3ff; font-family:'Outfit','ZCOOL KuaiLe',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:28px 16px; overflow-x:hidden;
  }
  .wrap{width:min(980px,100%);}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-family:'ZCOOL KuaiLe',sans-serif;font-size:clamp(28px,4vw,44px);letter-spacing:.02em;line-height:1}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{opacity:.65;font-size:14px;margin-top:6px;letter-spacing:.12em;text-transform:uppercase}
  .badge{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:100px;font-size:13px;backdrop-filter:blur(8px)}
  .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.4}}
  .stage{
    background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:28px;overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04) inset;
  }
  .screen{position:relative}
  svg{display:block;width:100%;height:auto}
  .controls{
    display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    padding:16px 20px;background:rgba(0,0,0,.28);border-top:1px solid rgba(255,255,255,.08);
  }
  .btns{display:flex;gap:10px}
  button{
    border:0;cursor:pointer;font-family:inherit;font-weight:700;
    padding:10px 18px;border-radius:14px;font-size:14px;transition:.2s;color:#101828;
  }
  .primary{background:linear-gradient(135deg,var(--accent),#ff7a3d);box-shadow:0 8px 20px -6px rgba(255,150,40,.6)}
  .primary:hover{transform:translateY(-2px)}
  .ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.14)}
  .ghost:hover{background:rgba(255,255,255,.18)}
  .ghost.active{background:var(--teal);color:#06302a;border-color:var(--teal)}
  .speed{display:flex;align-items:center;gap:12px;font-size:13px;opacity:.95}
  input[type=range]{width:170px;accent-color:var(--accent)}
  .speed b{font-size:18px;color:var(--accent);min-width:52px;text-align:right}
  .tips{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .tip{flex:1;min-width:200px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.6;opacity:.9}
  .tip strong{color:var(--accent)}
  @media(max-width:640px){.controls{justify-content:center}.speed{width:100%;justify-content:center}}
</style>
</head>
<body>

    <!-- near wing (flapping) -->

      <path d="M-20 -2 C-60 -12 -95 -10 -120 5" fill="none" stroke="#8fa0bb" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- near leg -->
    <polyline id="legNear" points="" fill="none" stroke="#ff9a2e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footNear"><ellipse cx="0" cy="0" rx="16" ry="8" fill="#ff6b3d" stroke="#1a2438" stroke-width="3"/></g>

    <rect x="551" y="115" width="10" height="18" rx="5" fill="#37e0c8" stroke="#0b2e2a" stroke-width="3"/>
    <path d="M530 152 L590 145" stroke="#0b2e2a" stroke-width="2" opacity=".3"/>
    <!-- arm / wing holding handle -->
    <path d="M430 300 C470 310 520 320 585 325" fill="none" stroke="#eef3ff" stroke-width="22" stroke-linecap="round"/>
    <path d="M430 300 C470 310 520 320 585 325" fill="none" stroke="#1a2438" stroke-width="26" stroke-linecap="round" opacity=".12"/>
    <path d="M430 300 C470 310 520 320 585 325" fill="none" stroke="#f7faff" stroke-width="22" stroke-linecap="round"/>

  </g>
  <!-- foreground grass -->
  <g id="grass" fill="#1fa37a"></g>
  <text x="24" y="46" font-size="22" font-weight="800" fill="#fff" opacity=".95" font-family="ZCOOL KuaiLe">鹈鹕海岸骑行 🚴</text>
  <text x="24" y="68" font-size="13" fill="#fff" opacity=".8" letter-spacing="2">COASTAL RIDE · SUNSET 18:24 · 24°C</text>
</svg>
    </div>
    <div class="controls">
      <div class="btns">
        <button class="primary" id="playBtn">⏸ 暂停</button>
        <button class="ghost" id="ringBtn">🔔 按铃</button>
        <button class="ghost" id="viewBtn">🌅 黄昏</button>
      </div>
      <div class="speed"><span>速度 SPEED</span><input id="speed" type="range" min="0" max="100" value="30"><b id="speedVal">10 km/h</b></div>

  <div class="tips">
    <div class="tip"><strong>纯 SVG 绘制：</strong>鹈鹕、自行车、海岸线全部是矢量路径，没有一张图片，放大也不模糊。</div>
    <div class="tip"><strong>双腿踩踏 IK：</strong>用 JS 实时计算脚踏圆周 + 膝盖弯曲，双脚交替踩踏，翅膀与围巾随速度摆动。</div>
    <div class="tip"><strong>试试交互：</strong>拖动速度条加速会有速度线，按铃鹈鹕喉囊会鼓起来“叮铃～”。</div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
let speedV=0.30, playing=true, t=0, night=false;
// build spokes
function spokes(gid){const g=$(gid);for(let i=0;i<8;i++){const a=i*Math.PI/4;const l=document.createElementNS(NS,'line');l.setAttribute('x1',Math.cos(a)*-52);l.setAttribute('y1',Math.sin(a)*-52);l.setAttribute('x2',Math.cos(a)*52);l.setAttribute('y2',Math.sin(a)*52);g.appendChild(l);}}
spokes('spokesR');spokes('spokesF');
// clouds
const clouds=[...document.querySelectorAll('.cloud')];
const cloudX=[120,480,760]; clouds.forEach((c,i)=>c.setAttribute('transform',`translate(${cloudX[i]},0)`));
// far birds
const birds=[...document.querySelectorAll('#farBirds path')];
// waves
const waves=[...document.querySelectorAll('#waves path')];
waves.forEach((w,i)=>{w.setAttribute('transform',`translate(${80+i*180},${340+i%2*8})`)});
// palms
function palm(x,y,s,c1='#1a7a5a',c2='#5b3a29'){
  const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${x},${y}) scale(${s})`);
  g.innerHTML=`<rect x="-4" y="-70" width="8" height="70" rx="4" fill="${c2}"/><g fill="${c1}"><ellipse cx="0" cy="-78" rx="30" ry="10" transform="rotate(-20)"/><ellipse cx="0" cy="-78" rx="30" ry="10" transform="rotate(20)"/><ellipse cx="0" cy="-82" rx="26" ry="9"/><circle cx="0" cy="-70" r="7" fill="#4a2d1e"/><circle cx="8" cy="-68" r="6" fill="#4a2d1e"/></g>`;
  return g;
}
const back=$('palmsBack'),front=$('palmsFront');
let palmBackX=[50,350,650,880], palmFrontX=[-40,280,620,940];
palmBackX.forEach(x=>back.appendChild(palm(x,382,0.9)));
palmFrontX.forEach(x=>front.appendChild(palm(x,505,1.5,'#149066')));
// grass tufts
const grass=$('grass');for(let i=0;i<18;i++){const x=i*55+10;const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x} 520 q4 -18 8 0 q4 -14 8 0`);p.setAttribute('stroke','#0d5c44');p.setAttribute('stroke-width','4');p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');grass.appendChild(p);}
// speed lines
const sl=$('speedLines');for(let i=0;i<6;i++){const l=document.createElementNS(NS,'line');l.setAttribute('x1','-120');l.setAttribute('x2','40');l.setAttribute('y1',180+i*45);l.setAttribute('y2',180+i*45);sl.appendChild(l);}
const slLines=[...sl.children];
let bellT=10;
function kmh(){return Math.round(4+speedV*20);}
$('speed').addEventListener('input',e=>{speedV=e.target.value/100;$('speedVal').textContent=kmh()+' km/h';});
$('speedVal').textContent=kmh()+' km/h';
$('playBtn').onclick=()=>{playing=!playing;$('playBtn').textContent=playing?'⏸ 暂停':'▶ 踩起来';$('statusText').textContent=playing?'正在 coastal 公路飞驰…':'鹈鹕停下来喝口水…';};
$('ringBtn').onclick=()=>{bellT=0;$('ringBtn').classList.add('active');setTimeout(()=>$('ringBtn').classList.remove('active'),600);};
$('viewBtn').onclick=(e)=>{night=!night;e.target.textContent=night?'🌙 夜骑':'🌅 黄昏';e.target.classList.toggle('active',night);document.querySelector('#sky stop:nth-child(1)').setAttribute('stop-color',night?'#0b1030':'#2b4a8a');document.querySelector('#sky stop:nth-child(2)').setAttribute('stop-color',night?'#2a2a6a':'#e8805a');};
function IK(hx,hy,fx,fy,l1,l2){
  let dx=fx-hx,dy=fy-hy;let d=Math.hypot(dx,dy);d=Math.min(d,l1+l2-1);d=Math.max(d,Math.abs(l1-l2)+1);
  const a=Math.atan2(dy,dx);const cosA=(l1*l1+d*d-l2*l2)/(2*l1*d);const ang=Math.acos(Math.max(-1,Math.min(1,cosA)));
  const kx=hx+Math.cos(a+ang)*l1, ky=hy+Math.sin(a+ang)*l1;return [kx,ky];
}
let eyeTimer=0;
function frame(dt){
  if(!playing){return;}
  // dt is ms. Keep time-scale gentle so default feels like leisurely riding.
  t+=dt*0.001*(0.25+speedV*0.9);
  const spd=0.35+speedV*1.1;
  const crankA=t*4.2;
  const cx=460,cy=430,R=26;
  const f1x=cx+Math.cos(crankA)*R, f1y=cy+Math.sin(crankA)*R;
  const f2x=cx+Math.cos(crankA+Math.PI)*R, f2y=cy+Math.sin(crankA+Math.PI)*R;
  $('crankArm1').setAttribute('x2',Math.cos(crankA)*R);$('crankArm1').setAttribute('y2',Math.sin(crankA)*R);
  $('crankArm2').setAttribute('x2',Math.cos(crankA+Math.PI)*R);$('crankArm2').setAttribute('y2',Math.sin(crankA+Math.PI)*R);
  $('pedal1').setAttribute('transform',`translate(${Math.cos(crankA)*R},${Math.sin(crankA)*R})`);
  $('pedal2').setAttribute('transform',`translate(${Math.cos(crankA+Math.PI)*R},${Math.sin(crankA+Math.PI)*R})`);
  // wheels — geared to the crank so pedals & wheels stay in sync
  const wheelDeg=crankA*57.3*2.2;$('spokesR').setAttribute('transform',`rotate(${wheelDeg})`);$('spokesF').setAttribute('transform',`rotate(${wheelDeg})`);
  // bob
  const bob=Math.sin(crankA*2)*2.2*Math.min(1,spd);
  $('rider').setAttribute('transform',`translate(0,${bob})`);
  $('shadow').setAttribute('rx',185-bob*1.2);
  // legs IK: hip ~ (400,330)
  const hx=400,hy=332+bob;
  let [k1x,k1y]=IK(hx,hy,f1x,f1y+bob*0,62,62);
  let [k2x,k2y]=IK(hx-12,hy,f2x,f2y,58,58);
  // push knees forward
  k1x+=14;k2x+=10;
  $('legNear').setAttribute('points',`${hx},${hy} ${k1x},${k1y} ${f1x},${f1y}`);
  $('legFar').setAttribute('points',`${hx-12},${hy} ${k2x},${k2y} ${f2x},${f2y}`);
  $('footNear').setAttribute('transform',`translate(${f1x},${f1y}) rotate(-8)`);
  $('footFar').setAttribute('transform',`translate(${f2x},${f2y}) rotate(-8)`);
  // wing flap
  $('wing').setAttribute('transform',`translate(390,${300+bob}) rotate(${Math.sin(t*5)*8*Math.min(1,spd)-6}) scale(1,${1+Math.sin(t*5)*0.04})`);
  // scarf flutter
  const fl=Math.sin(t*7)*6*spd;
  $('scarf').setAttribute('d',`M380 250 C330 240 290 ${250+fl} 250 ${270+fl} C285 275 300 285 250 300 C300 305 340 295 380 270 Z`);
  $('scarf2').setAttribute('d',`M380 265 C340 270 310 ${285+fl} 285 ${310+fl*1.4} C315 305 345 300 380 282 Z`);
  // pouch wobble + bell
  bellT+=dt*0.001;
  const wob=Math.sin(t*6)*2+(bellT<0.6?Math.sin(bellT*40)*8*(0.6-bellT):0);
  $('pouch').setAttribute('d',`M585 192 Q635 ${215+wob} 675 188 Q660 ${225+wob} 615 228 Q590 225 585 192`);
  // bg parallax
  const v=spd*dt*0.03;
  for(let i=0;i<cloudX.length;i++){cloudX[i]-=v*0.3;if(cloudX[i]<-120)cloudX[i]=1020;clouds[i].setAttribute('transform',`translate(${cloudX[i]},${Math.sin(t+i)*4})`);}
  birds.forEach((b,i)=>{const bx=((i*300+t*40*(0.5+speedV))+900)%1000-50;b.setAttribute('transform',`translate(${bx},${90+i*28+Math.sin(t*2+i)*6}) scale(${1-i*0.15})`);});
  waves.forEach((w,i)=>{const wx=(80+i*180 - t*40)%900;w.setAttribute('transform',`translate(${wx<0?wx+900:wx},${340+(i%2)*8+Math.sin(t*2.5+i)*2})`);});
  document.querySelectorAll('#dashes rect').forEach((r,i)=>{let x=(i*150 - t*140*spd)%1050;if(x<-80)x+=1050;r.setAttribute('x',x);});
  slLines.forEach((l,i)=>{let x=((i*220 - t*420*spd)%1100+1100)%1100-150;l.setAttribute('x1',x-60-speedV*60);l.setAttribute('x2',x);l.setAttribute('opacity',speedV>0.6?0.5:0);});
  palmBackX=palmBackX.map(x=>{x-=v*0.8;if(x<-60)x=960;return x;});
  [...back.children].forEach((g,i)=>g.setAttribute('transform',`translate(${palmBackX[i]},382) scale(0.9)`));
  palmFrontX=palmFrontX.map(x=>{x-=v*1.6;if(x<-80)x=980;return x;});
  [...front.children].forEach((g,i)=>g.setAttribute('transform',`translate(${palmFrontX[i]},505) scale(1.5)`));
  // blink
  eyeTimer+=dt*0.001;if(eyeTimer>2.6&&eyeTimer<2.75){$('lid').setAttribute('opacity','1');}else{$('lid').setAttribute('opacity','0');if(eyeTimer>3.1)eyeTimer=0;}
}
let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;frame(dt);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
</body>
</html>
